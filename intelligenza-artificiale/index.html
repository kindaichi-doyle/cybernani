<!doctype html>
<html lang="it">
<head>

<meta property="og:description" content="La macchina che indovina parole: un'animazione interattiva per spiegare ai bambini come funziona l'intelligenza artificiale, perché sbaglia e come usarla bene.">

<style>
@font-face{font-family:"Bricolage";src:url(../fonts/BricolageGrotesque.ttf) format("truetype");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:"Atkinson";src:url(../fonts/AtkinsonHyperlegible-Regular.ttf) format("truetype");font-weight:400}
@font-face{font-family:"Atkinson";src:url(../fonts/AtkinsonHyperlegible-Bold.ttf) format("truetype");font-weight:700}
:root{
  --ink:#141a26;--paper:#f1f2f4;--ver:#ff5b2e;--ind:#6366f1;--teal:#1f8a7a;--sun:#ffb547;
  --g1:#1d2432;--g2:#283041;--g3:#343d50;--line:rgba(20,26,38,.1);--mut:#6b7280;
  --cardW:clamp(360px,31vw,600px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-family:Atkinson,sans-serif}
button{font-family:Bricolage,sans-serif}
.micro{font:600 12px/1 Bricolage;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}

/* ---------- top nav ---------- */
#steps{position:absolute;top:14px;left:16px;right:calc(var(--cardW) + 16px);display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:5}
#steps button{font:600 14px/1 Bricolage;height:34px;min-width:34px;border-radius:10px;border:1px solid rgba(20,26,38,.14);background:rgba(255,255,255,.82);color:var(--ink);cursor:pointer;padding:0 11px;display:flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 2px 8px rgba(20,26,38,.06)}
#steps button.done{background:rgba(255,255,255,.55);color:var(--mut)}
#steps button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
#steps button .nm{display:none}
#steps button.cur .nm{display:inline}
#steps a.page{margin-left:auto;font:600 14px/1 Bricolage;color:var(--mut);text-decoration:none;padding:10px 12px;border-radius:10px;border:1px dashed rgba(20,26,38,.2)}
#steps a.page.home{margin-left:0;border-style:solid}
#steps a.page:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- card ---------- */
#card{position:absolute;top:0;right:0;bottom:0;width:var(--cardW);background:#141a26;color:var(--paper);padding:28px 32px 18px;display:flex;flex-direction:column;gap:14px;overflow:auto;transition:opacity .3s;z-index:4}
body.nocard #card{opacity:0;pointer-events:none}
body.nocard #stage,body.nocard #steps{right:16px}
.kicker{font:600 13px/1 Bricolage;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
#card h1{font:700 clamp(30px,2.6vw,50px)/1.04 Bricolage;margin:10px 0 0;letter-spacing:-.02em}
.fields{display:flex;flex-direction:column;gap:14px;font-size:clamp(17px,1.28vw,25px);line-height:1.3}
.f .lab{font:600 12px/1 Bricolage;letter-spacing:.16em;text-transform:uppercase;color:#9fb0c8;margin-bottom:6px}
.f.prova .lab{color:#ff9a7d}
.f.curio .lab{color:#7fd1c4}
.f.dom .lab{color:var(--sun)}
.lead{margin:0;font-size:clamp(19px,1.45vw,28px);line-height:1.3}
.ricorda{background:var(--sun);color:var(--ink);font:700 clamp(20px,1.6vw,30px)/1.15 Bricolage;padding:14px 18px;border-radius:10px;letter-spacing:-.01em}
.foot{margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:#8796ad;padding-top:8px;border-top:1px solid #2f3a50}
kbd{font:600 12px Bricolage;border:1px solid #47546d;border-radius:5px;padding:1px 6px;color:#c6d0de;background:rgba(255,255,255,.04)}
#stage kbd{border-color:rgba(20,26,38,.2);color:var(--ink);background:#fff}

/* ---------- stage ---------- */
#stage{position:absolute;top:64px;left:16px;right:calc(var(--cardW) + 16px);bottom:16px;display:flex;flex-direction:column;gap:18px;padding:8px 8px 0}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(20,26,38,.07)}
.dark{background:var(--g1);color:#e9edf2;border-color:transparent}
.hide{display:none!important}

/* sentence strip */
#sentence{padding:26px 34px;font:600 clamp(30px,2.8vw,54px)/1.2 Bricolage;letter-spacing:-.015em;min-height:120px}
#sentence .pr{color:var(--ink)}
#sentence .tok{color:var(--ver);display:inline-block;animation:pop .35s cubic-bezier(.3,1.5,.6,1)}
#sentence .tok.old{color:#c2410c}
@keyframes pop{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.caret{display:inline-block;width:.07em;height:.9em;background:var(--ver);vertical-align:-.1em;margin-left:.12em;animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{0%{opacity:1}100%{opacity:0}}
.chat{display:flex;flex-direction:column;gap:10px;font:400 clamp(22px,1.8vw,34px)/1.25 Atkinson;letter-spacing:0}
.chat .b{max-width:78%;padding:12px 18px;border-radius:16px}
.chat .u{align-self:flex-end;background:#d7f2e4;border-bottom-right-radius:4px}
.chat .a{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat .who{display:block;font:600 11px/1 Bricolage;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.chat .tok{font-weight:700}

/* machine */
#machine{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:18px;min-height:0}
#barsP{padding:22px 26px;display:flex;flex-direction:column;min-height:0}
#barsP .hd,#wheelP .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.bars{display:flex;flex-direction:column;gap:clamp(7px,1.3vh,14px);flex:1;min-height:0}
.row{display:grid;grid-template-columns:minmax(120px,30%) 1fr 74px;align-items:center;gap:12px;font:600 clamp(17px,1.35vw,26px)/1 Bricolage;cursor:default}
.row .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.row .track{height:clamp(20px,3.2vh,38px);background:#eef0f3;border-radius:6px;overflow:hidden}
.row .fill{height:100%;width:0;background:var(--g3);border-radius:6px;transition:width .45s cubic-bezier(.3,.8,.3,1),background .2s}
.row .pc{font:600 clamp(15px,1.1vw,21px)/1 Bricolage;color:var(--mut);font-variant-numeric:tabular-nums}
.row.hl .fill{background:var(--ver)}
.row.hl .w{color:var(--ver)}
.bars.cls .fill{background:var(--ind)}
.dark .row .track{background:rgba(255,255,255,.07)}
.dark .row .fill{background:#7b879b}
.dark .row .pc{color:#9fb0c8}
#wheelP{padding:22px 26px;display:flex;flex-direction:column;align-items:center;min-height:0}
#wheelP .hd{align-self:stretch}
#wheelWrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#wheel{height:100%;max-height:640px;width:auto;aspect-ratio:1;overflow:visible}
#wheel text{font-family:Bricolage}

/* controls */
#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px}
.btn{font:600 16px/1 Bricolage;border:1px solid rgba(20,26,38,.14);background:#fff;color:var(--ink);border-radius:10px;padding:11px 16px;cursor:pointer;display:flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#273043}
#temp{display:flex;align-items:center;gap:12px;margin-left:auto;padding:6px 10px 6px 14px;border-radius:12px;background:var(--paper)}
#temp input{width:220px;accent-color:var(--ver)}
#temp .v{font:700 20px/1 Bricolage;min-width:40px;font-variant-numeric:tabular-nums}
#temp .lbl2{font:600 13px/1.15 Bricolage;color:var(--mut);min-width:96px}
#temp.big{padding:14px 18px}
#temp.big input{width:340px}

/* extras */
.extra{padding:18px 24px}
#extra{flex:0 1 auto}
#history ol{margin:8px 0 0;padding-left:30px;font-size:clamp(20px,1.6vw,30px);line-height:1.35;display:flex;flex-direction:column;gap:6px}
#history li:first-child{color:var(--ver)}
#calc{display:grid;grid-template-columns:1fr 2fr;gap:16px;height:100%}
#calc .c{border-radius:12px;padding:14px 18px;background:var(--paper)}
#calc .c b{display:block;font:700 clamp(24px,2vw,38px)/1.1 Bricolage;margin-top:8px}
#tokens{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.word{font:700 clamp(34px,3vw,58px)/1 Bricolage;letter-spacing:.02em}
.tk{display:inline-flex;flex-direction:column;align-items:center;gap:8px;margin-right:6px}
.tk span{font:700 clamp(34px,3vw,58px)/1 Bricolage;padding:8px 14px;border-radius:10px;color:#fff}
.tk small{font:600 15px/1 Bricolage;color:var(--mut);font-variant-numeric:tabular-nums}
.arrow{font:400 40px/1 Bricolage;color:var(--mut)}
#stamp{position:absolute;pointer-events:none;font:800 clamp(34px,3.4vw,64px)/1 Bricolage;letter-spacing:.02em;padding:12px 22px;border:5px solid currentColor;border-radius:14px;
  transform:rotate(-6deg) scale(1.6);opacity:0;transition:all .35s cubic-bezier(.3,1.6,.6,1);background:rgba(255,255,255,.9);z-index:6;text-align:center}
#stamp.show{opacity:1;transform:rotate(-6deg) scale(1)}
#stamp small{display:block;font:600 clamp(15px,1.2vw,22px)/1.2 Bricolage;letter-spacing:0;margin-top:6px}

/* class game */
#classGame{flex:1;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:18px;min-height:0}
#classIn{display:flex;gap:12px;align-items:center;padding:16px 20px}
#classIn input{flex:1;font:600 28px/1 Bricolage;padding:14px 18px;border-radius:12px;border:1px solid rgba(20,26,38,.2);outline:none;background:var(--paper)}
#classIn input:focus{border-color:var(--ind);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
#classBarsP{padding:22px 26px;display:flex;flex-direction:column;min-height:0}
#classBarsP .row{cursor:pointer}
#classBarsP .row:hover .w{color:var(--ind)}
.empty{color:var(--mut);font-size:22px;margin:auto;text-align:center;line-height:1.4}

/* reading wall */
#reading{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:18px;min-height:0}
#wall{position:relative;overflow:hidden;padding:0 26px;font:400 clamp(17px,1.25vw,23px)/1.55 Atkinson;color:#7f8ba0;
  -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 80%,transparent)}
#wall .ln{white-space:nowrap}
#wall .ln.on{color:#dfe5ee}
#wall mark{background:none;color:var(--sun);font-weight:700}
#readBarsP{padding:22px 26px;display:flex;flex-direction:column;min-height:0}
#counter{font:700 clamp(30px,2.6vw,48px)/1 Bricolage;font-variant-numeric:tabular-nums;margin:2px 0 18px;letter-spacing:-.01em}

/* compare */
#compare{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
#compare>div{padding:22px 26px;display:flex;flex-direction:column;min-height:0}

/* intro */
#intro{flex:1;display:grid;grid-template-columns:1fr;place-items:center;min-height:0}
#introChat{width:min(1000px,96%);padding:30px 34px}
#introChat .chat{font-size:clamp(24px,2vw,38px)}
.trip{display:flex;align-items:center;gap:8px;margin:0 0 24px;flex-wrap:nowrap}
.trip span{font:600 14px/1 Bricolage;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:8px 12px;border:1px solid var(--line);border-radius:30px;background:#fff}
.trip span.ai{background:var(--ink);color:#fff;border-color:var(--ink)}
.trip i{flex:1 1 14px;height:2px;background:var(--ver);opacity:.6}

/* rules */
#rules{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:16px;min-height:0}
.rule{padding:30px 32px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.rule svg{width:64px;height:64px}
.rule h3{margin:0;font:700 clamp(26px,2.2vw,42px)/1.1 Bricolage;letter-spacing:-.01em}
.rule p{margin:0;font-size:clamp(18px,1.45vw,27px);line-height:1.35;color:#3d4556}
.rule.big{grid-column:span 2;background:var(--ink);color:#fff}
.rule.big p{color:#c6d0de}
.rule.big h3{font-size:clamp(34px,3.2vw,62px)}
.rule.big p{font-size:clamp(22px,1.8vw,34px)}
</style>
</head>
<body>
<nav id="steps"></nav>
<main id="stage">
  <section id="intro" class="hide">
    <div id="introChat" class="panel">
      <div class="trip"><span>Telefono</span><i></i><span>Wi-Fi</span><i></i><span>Cavi</span><i></i><span>Oceano</span><i></i><span>Data center</span><i></i><span class="ai">AI</span></div>
      <div class="chat"><div class="b u"><span class="who">Sofia</span>Scrivimi una storia sul mio gatto</div><div class="b a"><span class="who">AI</span><span id="introGen"></span><span class="caret"></span></div></div>
    </div>
  </section>
  <div id="sentence" class="panel hide"></div>
  <section id="classGame" class="hide">
    <div id="classIn" class="panel"><span class="micro" style="white-space:nowrap">Parola</span><input id="classInput" placeholder="scrivi una parola e premi Invio" autocomplete="off" spellcheck="false"><button class="btn" id="classReset">Azzera</button></div>
    <div id="classBarsP" class="panel"><div class="micro" style="margin-bottom:14px">La vostra classe · clic su una barra = +1 · tasto destro = −1</div><div class="bars cls" id="classBars"></div></div>
  </section>
  <section id="reading" class="hide">
    <div id="wall" class="panel dark"></div>
    <div id="readBarsP" class="panel"><div class="micro">Frasi lette</div><div id="counter">0</div><div class="micro" style="margin-bottom:12px">Dopo «salito sul» viene…</div><div class="bars" id="readBars"></div></div>
  </section>
  <section id="compare" class="hide">
    <div class="panel"><div class="micro" style="margin-bottom:14px">La vostra classe</div><div class="bars cls" id="cmpClass"></div></div>
    <div class="panel"><div class="micro" style="margin-bottom:14px">La macchina</div><div class="bars" id="cmpModel"></div></div>
  </section>
  <div id="extra" class="panel extra hide"></div>
  <section id="machine" class="hide">
    <div id="barsP" class="panel"><div class="hd"><span class="micro">Prossima parola: le probabilità</span><span class="micro" id="stepN"></span></div><div class="bars" id="bars"></div></div>
    <div id="wheelP" class="panel"><div class="hd"><span class="micro">Il dado truccato</span><span class="micro" id="wheelHint"><kbd>Spazio</kbd> gira</span></div><div id="wheelWrap"><svg id="wheel" viewBox="-230 -250 460 480"></svg></div></div>
  </section>
  <div id="controls" class="panel hide">
    <button class="btn pri" id="bSpin"><kbd style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)">Spazio</kbd> Una parola</button>
    <button class="btn" id="bAll"><kbd>G</kbd> Tutta la frase</button>
    <button class="btn" id="bRe"><kbd>R</kbd> Rigioca</button>
    <div id="temp"><span class="micro">Fantasia</span><input type="range" id="tIn" min="0" max="2.5" step="0.05" value="1"><span class="v" id="tV">1.0</span><span class="lbl2" id="tL">normale</span></div>
  </div>
  <section id="rules" class="hide"></section>
</main>
<aside id="card"></aside>
<div id="stamp"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
/* =========================================================
   TOY LANGUAGE MODELS (pesi inventati per la didattica)
   chiave = ultimo pezzo scritto → [pezzo, peso]

const GATTO={
 sul:[['tetto',34],['divano',20],['ramo',16],['letto',10],['tavolo',7],['frigorifero',5],['lampadario',3],['treno',2],['razzo',1.2],['dinosauro',.6]],
 _N1:[['e',30],['per',26],['.',18],['perché',14],['dove',12]],

 gli:[['uccellini',50],['gatti',25],['alberi',15],['astronauti',6],['dinosauri',4]],

const MODELS={

   verdict:()=>({txt:'INVENTATO',sub:'Il nome vero non è da nessuna parte nella macchina',col:'#e11d48'})},

   R:[['2.',44],['3.',31],['4.',14],['1.',7],['5.',4]],_E:[['.',100]]},fallback:'_E',
   verdict:g=>g[0]==='3.'?{txt:'GIUSTO: 3',sub:'…questa volta! Rigioca e vedi',col:'#16a34a'}:{txt:`SBAGLIATO: ${g[0].replace('.','')}`,sub:'In «carrozzeria» le R sono 3',col:'#e11d48'}},
 ragione:{start:'AI',chat:true,html:()=>`<div class="chat"><div class="b u"><span class="who">Tu</span>Quanto fa 7 × 8?</div><div class="b a"><span class="who">AI</span>7 × 8 fa 56.</div><div class="b u"><span class="who">Tu</span>Sei sicuro? Secondo me fa 54.</div><div class="b a"><span class="who">AI</span><span class="gen"></span><span class="caret"></span></div></div>`,T:{
   AI:[['Hai',58],['Scusa,',14],['No,',28]],
   Hai:[['ragione,',100]],'ragione,':[['scusa!',60],['mi',40]],mi:[['sono',100]],sono:[['sbagliata:',100]],'sbagliata:':[['fa',100]],

let cur=0,model=null,gen=[],T=1,busy=false,wheelRot=0,token=0,history=[];
const classCounts=new Map();

function dist(m,key){let L=m.T[key]||m.T[m.fallback]||[['.',100]];
  if(gen.length>=13)L=[['.',100]];
  let ps;
  if(T<=.02){const mx=Math.max(...L.map(x=>x[1]));ps=L.map(x=>x[1]===mx?1:0);const s=ps.reduce((a,b)=>a+b);ps=ps.map(p=>p/s)}
  else{const raw=L.map(x=>Math.pow(x[1],1/T)),s=raw.reduce((a,b)=>a+b);ps=raw.map(r=>r/s)}
  return L.map((x,i)=>({w:x[0],p:ps[i]})).sort((a,b)=>b.p-a.p)}
const curKey=()=>gen.length?gen[gen.length-1]:model.start;
const done=()=>gen.length&&ENDS(gen[gen.length-1]);
function sample(d){let r=Math.random(),acc=0;for(const x of d){acc+=x.p;if(r<=acc)return x}return d[0]}
const fmt=p=>p>=.995?'100%':p>=.1?Math.round(p*100)+'%':p>=.01?(p*100).toFixed(1).replace('.',',')+'%':p>0?'<1%':'0%';
const joinToks=a=>a.reduce((s,t)=>s+(s&&!/^[.,!?:]/.test(t)?' ':'')+t,'');

/* ---------- bars ---------- */
function renderBars(el,items,o={}){
  const max=o.scaleMax||Math.max(...items.map(x=>x.p),.0001);
  el.innerHTML=items.slice(0,o.n||9).map(x=>`<div class="row${x.w===o.hl?' hl':''}" data-w="${x.w}"><div class="w">${x.w==='.'?'<span style="color:var(--mut)">«.» fine</span>':x.w}</div><div class="track"><div class="fill" data-t="${100*x.p/max}" style="width:${o.instant?100*x.p/max:0}%"></div></div><div class="pc">${o.count!=null?x.c:fmt(x.p)}</div></div>`).join('');
  if(!o.instant)requestAnimationFrame(()=>requestAnimationFrame(()=>el.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.t+'%')));
}
function updateBars(el,items,o={}){ // in-place width transition when same words
  const rows=[...el.querySelectorAll('.row')];
  if(rows.length!==Math.min(items.length,o.n||9)||rows.some((r,i)=>r.dataset.w!==items[i].w))return renderBars(el,items,o);
  const max=o.scaleMax||Math.max(...items.map(x=>x.p),.0001);
  rows.forEach((r,i)=>{r.querySelector('.fill').style.width=(100*items[i].p/max)+'%';r.querySelector('.pc').textContent=o.count!=null?items[i].c:fmt(items[i].p);r.classList.toggle('hl',items[i].w===o.hl)})}

/* ---------- wheel ---------- */
const SL=['#283041','#343d50','#3f4a60','#4b5770','#2f3748','#3a4459','#465269','#525f79','#2b3344','#3d475c'];
function arc(a0,a1,r){const p=a=>[Math.sin(a)*r,-Math.cos(a)*r];const[x0,y0]=p(a0),[x1,y1]=p(a1);return`M0,0 L${x0},${y0} A${r},${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1},${y1} Z`}
function drawWheel(d,hl){
  let a=0,s=`<g id="wg" style="transform:rotate(${wheelRot}deg);transform-origin:0 0">`;
  const live=d.filter(x=>x.p>0);
  if(live.length===1){s+=`<circle r="200" fill="${live[0].w===''?'#e5e7eb':hl?'var(--ver)':SL[0]}"/>`+`<text x="0" y="-110" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">${live[0].w}</text>`}
  else live.forEach((x,i)=>{const a1=a+x.p*2*Math.PI,mid=(a+a1)/2,deg=mid*180/Math.PI;
    s+=`<path d="${arc(a,a1,200)}" fill="${x.w===hl?'var(--ver)':SL[i%SL.length]}" stroke="#fff" stroke-width="2"/>`;
    if((a1-a)*118>Math.max(46,x.w.length*13)){const fs=Math.max(16,Math.min(28,(a1-a)*60));const r=x.w.length>8?120:130;
      const rr=x.w.length>8?125:118,tx=Math.sin(mid)*rr,ty=-Math.cos(mid)*rr;
      s+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" fill="#fff" font-size="${fs}" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="wl" data-x="${tx}" data-y="${ty}">${x.w==='.'?'«.»':x.w}</text>`}
    x.a0=a;x.a1=a1;a=a1});
  s+=`</g><circle r="26" fill="#fff"/><circle r="9" fill="var(--ink)"/><path d="M-16,-232 L16,-232 L0,-198 Z" fill="var(--ver)"/>`;
  $('wheel').innerHTML=s;upright($('wg'));return live}
function upright(g){g.querySelectorAll('.wl').forEach(t=>t.setAttribute('transform',`rotate(${-wheelRot} ${t.dataset.x} ${t.dataset.y})`))}
function spinTo(live,choice,dur){
  return new Promise(res=>{
    if(live.length<=1||dur<=0){drawWheel(live,choice.w);return res()}
    const c=live.find(x=>x.w===choice.w),margin=(c.a1-c.a0)*.18,target=(c.a0+margin+Math.random()*((c.a1-c.a0)-2*margin))*180/Math.PI;
    const base=((wheelRot%360)+360)%360,delta=((360-target)-base+720)%360,turns=dur>1200?3:dur>500?1:0;
    const from=wheelRot,to=wheelRot+turns*360+delta,t0=performance.now(),g=$('wg'),my=token;
    const f=now=>{if(my!==token)return res();const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,4);wheelRot=from+(to-from)*e;g.style.transform=`rotate(${wheelRot}deg)`;upright(g);
      if(t<1)requestAnimationFrame(f);else{wheelRot=to;res()}};requestAnimationFrame(f)})}

/* ---------- sentence ---------- */
function renderSentence(){
  const s=STOPS[cur],m=model;if(!m)return;
  const toks=gen.map((t,i)=>`<span class="tok${i<gen.length-1?' old':''}">${t}</span>`);
  const txt=toks.reduce((acc,t,i)=>acc+(i&&!/^[.,!?:]/.test(gen[i])?' ':'')+t,'');
  if(m.chat){$('sentence').innerHTML=m.html();$('sentence').querySelector('.gen').innerHTML=txt}
  else $('sentence').innerHTML=m.html()+(s.noCaret?'<span style="color:var(--ind)">…</span>':txt+(done()?'':'<span class="caret"></span>'));
}
function refresh(hl){
  if(!model)return;const d=done()?[]:dist(model,curKey());
  $('stepN').textContent=done()?'fine':`tiro n° ${gen.length+1}`;
  if(done()){$('bars').innerHTML='<div class="empty">Frase finita.<br><kbd>R</kbd> per rigiocare</div>';drawWheel([{w:'',p:1}],null)}
  else{updateBars($('bars'),d,{hl,scaleMax:1,n:10});drawWheel(d,hl)}
  if(STOPS[cur].show.includes('compare'))renderCompare();
  return d}
async function step(fast){
  if(!model||busy)return;if(done()){reset();return}
  busy=true;const my=token;hideStamp();
  const d=dist(model,curKey()),ch=sample(d),live=drawWheel(d,null);
  updateBars($('bars'),d,{scaleMax:1,n:10});
  await spinTo(live,ch,fast?420:2300);if(my!==token){busy=false;return}
  drawWheel(d,ch.w);updateBars($('bars'),d,{hl:ch.w,scaleMax:1,n:10});
  await wait(fast?260:700);if(my!==token){busy=false;return}
  gen.push(ch.w);renderSentence();
  busy=false;
  if(done())finish();else refresh();
}
async function all(){if(!model)return;if(done())reset();const my=token;
  while(!done()&&my===token){await step(true);await wait(120)}}
function finish(){refresh();const st=joinToks(gen);history.unshift(st);history=history.slice(0,6);renderExtra();
  if(model.verdict)setTimeout(()=>showStamp(model.verdict(gen)),250)}
function reset(){token++;busy=false;gen=[];hideStamp();renderSentence();refresh()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- stamp ---------- */
function showStamp(v){const s=$('stamp');s.innerHTML=`${v.txt}<small>${v.sub}</small>`;s.style.color=v.col;
  const r=$('sentence').getBoundingClientRect();s.style.left=(r.left+r.width*.5)+'px';s.style.top=(r.bottom-30)+'px';s.style.translate='-50% 0';s.classList.add('show')}
function hideStamp(){$('stamp').classList.remove('show')}

/* ---------- temperature ---------- */
function setT(v){T=Math.max(0,Math.min(2.5,Math.round(v*20)/20));$('tIn').value=T;$('tV').textContent=T.toFixed(1).replace('.',',');
  $('tL').textContent=T<=.02?'sempre la più probabile':T<.6?'prudente':T<1.4?'normale':T<2?'creativa':'pazza!';
  if(!busy)refresh()}

/* ---------- class game ---------- */
function classItems(){const tot=[...classCounts.values()].reduce((a,b)=>a+b,0)||1;
  return [...classCounts.entries()].map(([w,c])=>({w,c,p:c/tot})).sort((a,b)=>b.c-a.c)}
function renderClass(){const it=classItems(),el=$('classBars');
  if(!it.length){el.innerHTML='<div class="empty">Nessuna parola ancora.<br>Scrivetele qui sopra!</div>';return}
  updateBars(el,it,{count:1,n:10})}
function addClass(w,n=1){w=w.trim().toLowerCase().replace(/[.,!?]+$/,'');if(!w)return;
  const v=(classCounts.get(w)||0)+n;if(v<=0)classCounts.delete(w);else classCounts.set(w,v);renderClass()}
$('classInput').addEventListener('keydown',e=>{if(e.key==='Enter'){addClass(e.target.value);e.target.value=''}if(e.key==='Escape')e.target.blur();e.stopPropagation()});

function startReading(){stopReading();const wall=$('wall');wall.innerHTML='';const tally={};let n=0,shown=0;
  const base=dist(MODELS.gatto,'sul');
  const tick=()=>{
    const isCat=Math.random()<.55;let html;

      html=`<div class="ln on">${SUBJ[Math.random()*SUBJ.length|0]} è salito sul <mark>${w}</mark> ${TAIL[Math.random()*TAIL.length|0]}</div>`}
    else html=`<div class="ln">${OTHER[Math.random()*OTHER.length|0]}</div>`;
    wall.insertAdjacentHTML('beforeend',html);while(wall.children.length>40)wall.firstChild.remove();
    wall.scrollTop=wall.scrollHeight;
    n+=Math.floor(1e6+Math.random()*4e7);$('counter').textContent=n.toLocaleString('it-IT');
    const items=base.map(x=>({w:x.w,p:(tally[x.w]||0)/Math.max(1,shown)}));
    updateBars($('readBars'),items,{n:10,scaleMax:.5});
  };
  renderBars($('readBars'),base.map(x=>({w:x.w,p:0})),{n:10,instant:true});
  readTimer=setInterval(tick,140)}

function startIntro(){stopIntro();let toks=[],k='sul';const pre='C\'era una volta un gatto che è salito sul';const el=$('introGen');let i=0;const words=pre.split(' ');
  const savedT=T;
  const tick=()=>{
    if(i<words.length){toks.push(words[i++])}
    else{const L=GATTO[k]||GATTO._N2;const raw=L.map(x=>x[1]),s=raw.reduce((a,b)=>a+b);let r=Math.random()*s,w=L[0][0];for(const x of L){r-=x[1];if(r<=0){w=x[0];break}}
      toks.push(w);k=w;if(ENDS(w)||toks.length>26){el.textContent=joinToks(toks);introTimer=setTimeout(()=>{toks=[];i=0;k='sul';tick()},2600);return}}

 heart:'<svg viewBox="0 0 48 48"><path d="M24 40S7 30 7 18a8.5 8.5 0 0 1 17-2 8.5 8.5 0 0 1 17 2c0 12-17 22-17 22z" fill="none" stroke="#e11d48" stroke-width="3"/></svg>'};
$('rules').innerHTML=[
 ['big','idea','Usala per farti venire idee','Spiegami in un altro modo · Interrogami · Inventiamo una storia insieme.'],
 ['','check','Controlla sempre','Per le cose importanti: un libro, un sito serio, un adulto. Chiediti: «come faccio a sapere che è vero?»'],
 ['','lock','Niente dati personali','Nome, indirizzo, scuola, foto, segreti: ricordate il viaggio, finiscono nel computer di un\'azienda.'],
 ['','brain','Pensa tu','Se fa i compiti al posto tuo, il cervello che si allena è il suo, non il tuo.'],
 ['','heart','Non è un amico','Per le cose importanti e per le emozioni, parla con persone vere.']
].map(([c,i,h,p])=>`<div class="rule panel ${c}">${IC[i]}<h3>${h}</h3><p>${p}</p></div>`).join('');

/* =========================================================
   NAVIGATION + CARD
   ========================================================= */
const field=(lab,txt,cls='')=>txt?`<div class="f ${cls}"><div class="lab">${lab}</div><div>${txt}</div></div>`:'';
function renderCard(){const s=STOPS[cur];
  $('card').innerHTML=`<div><div class="kicker">${cur===0?'cybernani · intelligenza artificiale':`Fermata ${cur} di ${STOPS.length-1}`}</div><h1>${s.title}</h1></div>
  <div class="fields">${s.lead?`<p class="lead">${s.lead}</p>`:''}${field('Cosa succede',s.cos)}${field('Domanda per la classe',s.dom,'dom')}${field('Prova',s.prova,'prova')}${field('Lo sapevi?',s.curio,'curio')}${s.ricorda?`<div class="ricorda">${s.ricorda}</div>`:''}</div>
  <div class="foot"><span><kbd>←</kbd><kbd>→</kbd> fermate · <kbd>Spazio</kbd> gira · <kbd>G</kbd> frase intera · <kbd>R</kbd> rigioca · <kbd>H</kbd> nascondi testo · <kbd>F</kbd> schermo intero</span></div>`}
function renderSteps(){
  $('steps').innerHTML=STOPS.map((s,i)=>`<button data-i="${i}" class="${i===cur?'cur':i<cur?'done':''}" title="${s.nm}">${i===0?'⌂':i}<span class="nm">${s.nm}</span></button>`).join('')+
    `<a class="page" href="../viaggio-messaggio/">← Il viaggio del messaggio</a><a class="page home" href="../">cybernani</a>`;
  $('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>goTo(+b.dataset.i))}
const SECTIONS=['intro','sentence','classGame','reading','compare','extra','machine','controls','rules'];
function goTo(i){
  i=Math.max(0,Math.min(STOPS.length-1,i));const prevModel=STOPS[cur].model;cur=i;token++;busy=false;hideStamp();
  const s=STOPS[i];
  SECTIONS.forEach(id=>$(id).classList.toggle('hide',!s.show.includes(id)));
  ['bSpin','bAll','bRe','temp'].forEach(id=>$(id).classList.toggle('hide',!(s.ctl||[]).includes(id)));
  $('temp').classList.toggle('big',!!s.bigTemp);
  $('extra').style.flex=s.show.includes('machine')?'0 1 auto':'1';
  $('wheelHint').style.visibility=(s.ctl||[]).includes('bSpin')?'visible':'hidden';
  if(i!==7)setT(1);
  if(s.model){const keep=s.model===prevModel&&!done()&&i>=4&&i<=6;model=MODELS[s.model];if(!keep)gen=[]}else model=null;
  renderCard();renderSteps();renderExtra();
  if(s.show.includes('intro'))startIntro();else stopIntro();
  if(s.show.includes('reading'))startReading();else stopReading();
  if(s.show.includes('classGame')){renderClass();setTimeout(()=>$('classInput').focus(),50)}
  if(model){renderSentence();refresh()}
  if(s.show.includes('compare'))renderCompare();
}
$('bSpin').onclick=()=>step(false);$('bAll').onclick=()=>all();$('bRe').onclick=()=>reset();
$('tIn').oninput=e=>setT(+e.target.value);
const hasAction=()=>(STOPS[cur].ctl||[]).length>0;
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;if(document.activeElement&&document.activeElement.tagName==='INPUT'&&document.activeElement.type!=='range')return;
  const k=e.key,s=STOPS[cur];
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();goTo(cur+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();goTo(cur-1)}
  else if(k===' '||k==='Enter'){e.preventDefault();if((s.ctl||[]).includes('bSpin'))step(false);else if(hasAction())all();else goTo(cur+1)}
  else if(k==='g'||k==='G'){if(model&&hasAction())all()}
  else if(k==='r'||k==='R'){if(model&&hasAction())reset()}
  else if(k==='ArrowUp'&&cur===7){e.preventDefault();setT(T+.1)}
  else if(k==='ArrowDown'&&cur===7){e.preventDefault();setT(T-.1)}
  else if(k==='Home'||k==='0')goTo(0);
  else if(/^[1-9]$/.test(k))goTo(+k);
  else if(k==='h'||k==='H')document.body.classList.toggle('nocard');
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
(async()=>{try{await Promise.all([document.fonts.load('700 20px Bricolage'),document.fonts.load('400 20px Atkinson')])}catch(_){}goTo(0)})();
</script>
