<style>
@font-face{font-family:"Bricolage";src:url(../fonts/BricolageGrotesque.ttf) format("truetype");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:"Atkinson";src:url(../fonts/AtkinsonHyperlegible-Regular.ttf) format("truetype");font-weight:400}
@font-face{font-family:"Atkinson";src:url(../fonts/AtkinsonHyperlegible-Bold.ttf) format("truetype");font-weight:700}
:root{
  --ink:#141a26;--paper:#f1f2f4;--ver:#ff5b2e;--ind:#6366f1;--teal:#1f8a7a;--sun:#ffb547;
  --cardW:clamp(360px,31vw,600px);--cardH:clamp(230px,31vh,340px);--top:72px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-family:Atkinson,sans-serif}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#world.dragging{cursor:grabbing}
#world.pointing{cursor:pointer}
#world text{font-family:Bricolage,sans-serif}
#world text.a{font-family:Atkinson,sans-serif}
.only{display:none}
.led{animation:blink 1.7s steps(2,jump-none) infinite}
@keyframes blink{0%{opacity:1}100%{opacity:.25}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s cubic-bezier(.2,.6,.4,1) infinite;opacity:0}
@keyframes ring{0%{transform:scale(.04);opacity:.95}100%{transform:scale(1);opacity:0}}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cursor{animation:blink 1s steps(2,jump-none) infinite}

/* ---------- card ---------- */
#card{position:absolute;background:#141a26;color:var(--paper);padding:28px 32px 18px;display:flex;flex-direction:column;gap:14px;overflow:auto;
  transition:opacity .3s}
body.side #card{top:0;right:0;bottom:0;width:var(--cardW)}
body.bottom #card{left:0;right:0;bottom:0;height:var(--cardH);display:grid;grid-template-columns:minmax(300px,1fr) 2.2fr;grid-template-rows:1fr auto;column-gap:40px;padding:24px 36px 14px}
body.nocard #card{opacity:0;pointer-events:none}
.kicker{font:600 13px/1 Bricolage;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
#card h1{font:700 clamp(30px,2.6vw,50px)/1.04 Bricolage;margin:10px 0 0;letter-spacing:-.02em}
.fields{display:flex;flex-direction:column;gap:14px;font-size:clamp(17px,1.28vw,25px);line-height:1.3}
body.bottom .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px;align-content:start}
.f .lab{font:700 13px/1 Bricolage;letter-spacing:.12em;text-transform:uppercase;color:#9fb0c8;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.f.vede .lab{color:var(--sun)}
.f.curio .lab{color:#7fd1c4}
.chip{font:700 11px/1 Bricolage;letter-spacing:.06em;padding:4px 7px;border-radius:20px;background:var(--sun);color:var(--ink);text-transform:uppercase}
.chip.off{background:var(--ver);color:#fff}
.lead{margin:0;font-size:clamp(19px,1.45vw,28px);line-height:1.3}
.hint{color:#9fb0c8;font-size:clamp(15px,1vw,19px);margin:0}
.f.video .lab{color:#ff9a7d}
.vids{display:flex;flex-direction:column;gap:8px}
.vids a{display:inline-block;align-self:flex-start;background:var(--ver);color:#fff;text-decoration:none;font:700 clamp(16px,1.1vw,21px)/1.2 Bricolage;padding:9px 16px;border-radius:10px}
.vids a:hover{background:#ff7a5c}
.ricorda{background:var(--sun);color:var(--ink);font:700 clamp(20px,1.6vw,30px)/1.15 Bricolage;padding:14px 18px;border-radius:10px;letter-spacing:-.01em}
.foot{margin-top:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:#8796ad;padding-top:8px;border-top:1px solid #2f3a50}
body.bottom .foot{grid-column:1/-1;margin-top:0}
.foot button{font:700 14px Bricolage;border:0;border-radius:30px;padding:8px 14px;cursor:pointer;background:#2f3a50;color:var(--paper)}
.foot button:hover{background:#3d4a64}
.foot button.on{background:var(--sun);color:var(--ink)}
kbd{font:700 12px Bricolage;border:1px solid #47546d;border-radius:5px;padding:1px 5px;color:#c6d0de}

/* ---------- steps ---------- */
#steps{position:absolute;top:14px;left:16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:3}
body.side #steps{right:calc(var(--cardW) + 16px)}
body.bottom #steps{right:16px}
#steps button{font:600 14px/1 Bricolage;height:34px;min-width:34px;border-radius:10px;border:1px solid rgba(20,26,38,.14);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(20,26,38,.06);color:var(--ink);cursor:pointer;padding:0 11px;display:flex;align-items:center;gap:7px;white-space:nowrap}
#steps button.done{background:rgba(255,255,255,.55);color:#6b7280}
#steps button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
#steps button .nm{display:none}
#steps a.page{margin-left:auto;font:600 14px/1 Bricolage;color:#6b7280;text-decoration:none;padding:10px 12px;border-radius:10px;border:1px dashed rgba(20,26,38,.2);background:rgba(255,255,255,.6)}
#steps a.page.home{margin-left:0;border-style:solid}
#steps a.page:hover{color:var(--ink);border-color:var(--ink)}
#steps button.cur .nm{display:inline}

/* ---------- hud ---------- */
#hud{position:absolute;left:16px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid rgba(20,26,38,.1);border-radius:14px;padding:12px 14px 12px;width:290px;box-shadow:0 12px 32px rgba(20,26,38,.14);z-index:3}
body.side #hud{bottom:16px}
body.bottom #hud{top:var(--top)}
#hud .t{font:600 11px/1 Bricolage;letter-spacing:.14em;text-transform:uppercase;color:#6b7280;margin-bottom:8px;display:flex;justify-content:space-between}
#hud .bub{background:#d7f2e4;border-radius:12px 12px 3px 12px;padding:8px 10px 6px;margin-left:30px;font-size:19px}
#hud .bub.in{background:#fff;border:1px solid #e3e6ea;border-radius:12px 12px 12px 3px;margin:8px 30px 0 0;display:none}
#hud .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:#7a6f66}
#hud .meta svg{width:24px;height:14px}
#hudStatus{font:700 16px/1.25 Bricolage;margin-top:9px;min-height:20px}
#lockChip{cursor:pointer;display:flex;align-items:center;gap:4px}
#lockChip svg{width:12px;height:14px}

#flash{position:absolute;left:0;right:0;top:20%;text-align:center;font:800 clamp(50px,7vw,130px)/1 Bricolage;color:var(--ver);
  text-shadow:0 8px 40px rgba(20,26,38,.25);letter-spacing:-.02em;pointer-events:none;opacity:0;transform:scale(.8);transition:all .35s cubic-bezier(.3,1.6,.6,1);z-index:4}
#flash.show{opacity:1;transform:scale(1)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font:700 15px Bricolage;padding:6px 10px;border-radius:8px;display:none;z-index:5}

/* ---------- mobile ---------- */
#world{touch-action:none}
.grab{display:none}
.mnav{display:flex;gap:8px;margin-left:auto}
.mnav button{font:700 15px/1 Bricolage;min-width:44px;height:40px}
.mnav #bPrev{font-size:17px}
@media (max-width:820px){
  :root{--top:58px;--cardH:46vh}
  #steps{top:10px;left:10px!important;right:10px!important;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  #steps::-webkit-scrollbar{display:none}
  #steps button{flex:0 0 auto;height:36px}
  #steps a.page{flex:0 0 auto;margin-left:6px}
  body.bottom #card{display:flex;flex-direction:column;gap:10px;padding:22px 18px 12px;border-radius:18px 18px 0 0;height:var(--cardH)}
  body.mini #card{height:auto}
  body.mini #card .fields{display:none}
  .grab{display:block;position:absolute;top:0;left:50%;transform:translateX(-50%);width:84px;height:22px;border:0;background:none;cursor:pointer;padding:0}
  .grab::after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#47546d;margin:8px auto 0}
  .kicker{font-size:11px}
  #card h1{font-size:24px;margin-top:6px}
  .fields{font-size:16px;gap:10px}
  .lead{font-size:17px}
  .ricorda{font-size:18px;padding:10px 14px}
  .f .lab{font-size:11px}
  .vids a{font-size:15px}
  .foot{gap:8px;padding-top:10px}
  .foot .keys{display:none}
  .foot button{padding:10px 14px}
  #hud{transform:scale(.56);transform-origin:top left;left:10px}
  body.bottom #hud,body.side #hud{top:var(--top);bottom:auto}
  #tip{display:none!important}
  #flash{top:16%}
}
@media (max-height:520px) and (orientation:landscape){
  :root{--top:52px;--cardW:min(44vw,420px)}
  #steps{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #steps button{flex:0 0 auto;height:32px}
  #card{padding:14px 16px 10px;gap:8px}
  #card h1{font-size:22px}
  .fields{font-size:15px;gap:8px}
  .foot .keys{display:none}
  #hud{transform:scale(.6);transform-origin:bottom left;left:8px}
  body.side #hud{bottom:8px}
}
</style>

<script>
'use strict';
/* =========================================================
   PALETTE + SVG HELPERS
   ========================================================= */
const C={ink:'#141a26',paper:'#f1f2f4',ver:'#ff5b2e',ind:'#6366f1',sun:'#ffb547',teal:'#1f8a7a',
  wall:'#fbfaf8',room:'#ebe6df',floor:'#d3cbc0',wood:'#a88f78',woodD:'#7e6a58',furn:'#c9bfb3',
  roofS:'#c8644a',roofN:'#5b7286',roofU:'#47627a',grass:'#9db58c',
  road:'#363d4b',side:'#d8dce1',sea1:'#3f88b8',sea2:'#0c2740',ground1:'#2a3344',ground2:'#1b2230',
  grey:'#a2abb5',greyD:'#87909b',dark:'#1d2432',rack:'#283041',haze1:'#dbe2e9',haze2:'#ccd6df',
  plum:'#8a6fd1',amber:'#d9a13b',green:'#5f9a72',blue:'#3f7fb6',wifi:'#1fa6d8',lite:'#eef1f5'};
const st=(s,w)=>s?` stroke="${s}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`:'';
const R=(x,y,w,h,f,s='',sw=0,rx=0,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}"${st(s,sw)} ${ex}/>`;
const P=(d,f,s='',sw=0,ex='')=>`<path d="${d}" fill="${f}"${st(s,sw)} ${ex}/>`;
const Ci=(x,y,r,f,s='',sw=0,ex='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${st(s,sw)} ${ex}/>`;
const T=(x,y,t,size,f=C.ink,anc='start',wt=700,ex='')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${f}" text-anchor="${anc}" font-weight="${wt}" ${ex}>${t}</text>`;
const TA=(x,y,t,size,f=C.ink,anc='start',wt=400)=>T(x,y,t,size,f,anc,wt,'class="a"');
/* label pill that appears only when its on-screen size is readable (semantic zoom) */
const LIGHT={color:'#f4f6f9',txt:'#141a26'};
function label(x,y,text,size,o={}){
  const color=o.color||C.ink, txt=o.txt||'#f4f6f9', h=size*1.7;
  let s=`<g class="lbl" data-size="${size}">`;
  if(o.to) s+=P(`M${x},${y} L${o.to[0]},${o.to[1]}`,'none',color,size*.08)+Ci(o.to[0],o.to[1],size*.2,color,o.ring||'#ffffff',size*.07);
  s+=R(x-size*4,y-h/2,size*8,h,color,'',0,h*.28,'class="pill"')+T(x,y+size*.35,text,size,txt,'middle',600);
  return s+'</g>';
}
const leds=(x0,y0,cols,rows,dx,dy,r)=>{let s='';const cs=['#5fe08a','#5fe08a','#56c8ff','#5fe08a',C.sun];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const c=cs[(i*7+j*3)%cs.length];
  s+=R(x0+i*dx-r,y0+j*dy-r*.45,r*2,r*.9,c,'',0,r*.3,`class="led" style="animation-delay:-${((i*13+j*7)%17)/10}s"`)}return s};

/* =========================================================
   ROUTE  (andata: Sofia -> server, risposta: Sam -> server -> Sofia)
   ========================================================= */
const RAW=[
 // andata: Sofia (Italia) -> server (USA) -> Sam
 [495,1470,'sofiaPhone','air'],[830,1528,'routerS'],[900,1528],[900,1820],[2230,1820],[2230,1600,'cabinet'],
 [2260,1600],[2260,1900],[3380,1900],[3380,1640,'centrale'],[3420,1640],[3420,1900],[4580,1900],[4580,1640,'mix'],
 [4620,1640],[4620,1900],[5440,1900],[5440,1662,'approdo'],[5470,1662],[5470,1900],[5560,1900],[5905,2585],
 [6475,2596,'mare'],[7050,2606],[7385,1900],[7830,1900],[7830,1560,'dc'],[7850,1560],[7850,1900],
 [9130,1900],[9130,1600,'cabUS'],[9160,1600],[9160,1820],[9500,1820],[9500,1528],[9570,1528,'routerSam','air'],[9905,1470,'samPhone'],
 // risposta: Sam -> server -> oceano -> Sofia
 [9905,1490,'samReply','air'],[9570,1538],[9525,1538],[9525,1848],[9190,1848],[9190,1612],[9210,1612],[9210,1928],
 [7870,1928],[7870,1580,'dcReply'],[7888,1580],[7888,1928],[7397,1928],[7064,2578],[5893,2558],[5545,1928],
 [2310,1928],[2310,1612],[2290,1612],[2290,1848],[925,1848],[925,1538],[830,1538,'routerS2','air'],[495,1490,'sofiaReply']
];
const PTS=RAW.map(p=>({x:p[0],y:p[1],name:typeof p[2]==='string'&&p[2]!=='air'?p[2]:null,air:p.includes('air')}));
const CUM=[0];for(let i=1;i<PTS.length;i++)CUM.push(CUM[i-1]+Math.hypot(PTS[i].x-PTS[i-1].x,PTS[i].y-PTS[i-1].y));
const AT={};PTS.forEach((p,i)=>{if(p.name)AT[p.name]=CUM[i]});
const L_END=CUM[CUM.length-1], L_A=AT.samReply;
function pointAt(s){s=Math.max(0,Math.min(L_END,s));let i=0;while(i<CUM.length-2&&CUM[i+1]<s)i++;
  const a=PTS[i],b=PTS[i+1],t=(s-CUM[i])/((CUM[i+1]-CUM[i])||1);return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
function trailD(from,to){let d='',pen=false;
  for(let i=0;i<PTS.length-1;i++){const l0=CUM[i],l1=CUM[i+1];if(l1<=from||l0>=to)continue;
    if(PTS[i].air){pen=false;continue}
    const pa=pointAt(Math.max(from,l0)),pb=pointAt(Math.min(to,l1));
    if(!pen){d+=`M${pa.x.toFixed(1)},${pa.y.toFixed(1)}`;pen=true}d+=`L${pb.x.toFixed(1)},${pb.y.toFixed(1)}`}
  return d}

/* =========================================================
   ART
   ========================================================= */
function house(ox,mir,roof){
  const m=(x,w=0)=>ox+(mir?700-x-w:x);
  let s='';
  // shell + attic
  s+=P(`M${ox-20},1160 L${ox+350},905 L${ox+720},1160 Z`,C.wall);
  s+=R(ox-6,1150,712,550,C.wall);
  s+=R(ox+16,1168,668,512,C.room);
  s+=R(ox+16,1168,668,512,'url(#roomShade)');
  s+=R(ox+16,1664,668,16,C.floor);
  // roof band
  s+=P(`M${ox-48},1178 L${ox+350},900 L${ox+748},1178`,'none',roof,34,'stroke-linejoin="miter" stroke-linecap="butt"');
  s+=P(`M${ox-48},1178 L${ox+350},900 L${ox+748},1178`,'none','rgba(255,255,255,.18)',4,'transform="translate(0,-14)"');
  // partition wall + door gap
  s+=R(m(440,14),1168,14,190,C.wall);
  // window
  s+=R(m(52,156),1232,156,150,'#ffffff',' ',0,3)+R(m(60,140),1240,140,134,'url(#glass)',' ',0,2)+R(m(128,4),1240,4,134,'#ffffff');
  // framed print
  s+=R(m(276,96),1252,96,124,'#ffffff','',0,2)+R(m(286,76),1262,76,104,'#d9d2c8')+Ci(m(324),1300,18,roof,'',0,'opacity=".85"')+R(m(296,56),1330,56,4,'#bcb3a7');
  // desk
  s+=R(m(108,284),1550,284,10,C.wood,'',0,2)+R(m(122,6),1560,6,104,C.woodD)+R(m(374,6),1560,6,104,C.woodD)+R(m(270,94),1560,94,40,'#b9a08a','',0,2)+R(m(304,26),1576,26,3,C.woodD,'',0,1.5);
  // lamp (thin arm + warm cone)
  s+=P(`M${m(260)},1550 L${m(256)},1494 L${m(288)},1472`,'none','#2a3242',3.2);
  s+=P(`M${m(276)},1462 L${m(310)},1476 L${m(296)},1490 Z`,'#2a3242');
  s+=P(`M${m(296)},1488 L${m(260)},1550 L${m(360)},1550 L${m(306)},1482 Z`,'rgba(255,190,90,.16)');
  s+=R(m(244,32),1545,32,5,'#2a3242','',0,2);
  // mug
  s+=R(m(332,18),1530,18,20,'#f6f3ee','',0,3);
  // phone stand
  s+=P(`M${m(178)},1550 L${m(212)},1550 L${m(206)},1540 L${m(184)},1540 Z`,'#3a4252');
  // hallway: shelf + plant
  s+=R(m(470,150),1546,150,8,C.wood,'',0,2);
  s+=R(m(478,44),1520,44,26,'#d9d2c8','',0,2)+R(m(560,10),1514,10,32,'#7b8a9c',' ',0,1)+R(m(574,10),1520,10,26,'#b6a48f',' ',0,1);
  s+=P(`M${m(476)},1666 L${m(482)},1612 L${m(522)},1612 L${m(528)},1666 Z`,'#cbbba8');
  s+=Ci(m(502),1580,30,C.green)+Ci(m(486),1600,20,'#538a65')+Ci(m(520),1596,22,'#6aa77e');
  return s;
}
function router(cx,cy){
  let s='';
  s+=P(`M${cx-30},${cy-14} L${cx-36},${cy-50}`,'none','#2a3242',3.5)+P(`M${cx+30},${cy-14} L${cx+36},${cy-50}`,'none','#2a3242',3.5);
  s+=R(cx-46,cy-16,92,30,'#fbfbfc','',0,6)+R(cx-46,cy+6,92,8,'#dfe3e8','',0,4)+R(cx-46,cy-16,92,2,'#ffffff','',0,1);
  for(let i=0;i<5;i++)s+=R(cx-37+i*7.5,cy,4.4,1.8,i===4?'#56c8ff':'#5fe08a','',0,.9,`class="led" style="animation-delay:-${i*.33}s"`);
  s+=R(cx+6,cy-9,34,10,C.teal,'',0,2)+T(cx+23,cy-2.2,'PROVIDER',4.8,'#fff','middle',700,'letter-spacing=".4"');
  return s;
}
function phone(cx,cy,id,header){
  let s=`<g id="${id}">`;

/* smooth zoom-pan (van Wijk & Nuij, as in d3.interpolateZoom) */
function zoomInterp(p0,p1){const rho=1.35,r2=rho*rho,r4=r2*r2;const[x0,y0,w0]=p0,[x1,y1,w1]=p1,dx=x1-x0,dy=y1-y0,d2=dx*dx+dy*dy;let f,S;
  if(d2<1e-9){S=Math.log(w1/w0)/rho;f=t=>[x0+t*dx,y0+t*dy,w0*Math.exp(rho*t*S)]}
  else{const d1=Math.sqrt(d2),b0=(w1*w1-w0*w0+r4*d2)/(2*w0*r2*d1),b1=(w1*w1-w0*w0-r4*d2)/(2*w1*r2*d1),
    q0=Math.log(Math.sqrt(b0*b0+1)-b0),q1=Math.log(Math.sqrt(b1*b1+1)-b1);S=(q1-q0)/rho;
    f=t=>{const s=t*S,c0=Math.cosh(q0),u=w0/(r2*d1)*(c0*Math.tanh(rho*s+q0)-Math.sinh(q0));return[x0+u*dx,y0+u*dy,w0*c0/Math.cosh(rho*s+q0)]}}
  f.duration=Math.abs(S)*1000*rho/Math.SQRT2;return f}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeS=t=>-(Math.cos(Math.PI*t)-1)/2;
function tween(dur,fn){const my=token;return new Promise(res=>{const t0=performance.now();
  const f=now=>{if(my!==token)return res(false);const t=Math.min(1,(now-t0)/dur);fn(t);if(t<1)requestAnimationFrame(f);else res(true)};requestAnimationFrame(f)})}
async function camTo(target,min=700,max=2300){const f=zoomInterp([cam.cx,cam.cy,cam.w],target);
  const d=Math.max(min,Math.min(max,f.duration));return tween(d,t=>setCam(f(ease(t))))}

  const s=STOPS[i];
  applyLayout();
  if(i<11)read=false;if(i>=12)read=true;replyRead=i>=14;
  flash('');renderCard();renderSteps();renderShow();
  if(s.lampo){setPos(0);await camTo(camFor(s.rect));if(my!==token)return;await new Promise(r=>setTimeout(r,350));if(my!==token)return;
    await tween(1100,t=>setPos(L_END*t));if(my!==token)return;replyRead=true;renderPhones();renderPackets();flash('Meno di 1 secondo!');return}
  const travel=prev===i-1&&s.at>pos+1;
  if(s.follow&&travel){
    const s0=pos,b=sceneBox(),kf=b.w/1700;
    const f=zoomInterp([cam.cx,cam.cy,cam.w],camForPoint(pointAt(s0),kf));
    if(!await tween(Math.max(800,Math.min(1600,f.duration)),t=>setCam(f(ease(t)))))return;
    if(!await tween(9000,t=>{setPos(s0+(s.at-s0)*easeS(t));const c=camForPoint(pointAt(pos),kf);setCam([cam.cx+(c[0]-cam.cx)*.12,cam.cy+(c[1]-cam.cy)*.12,c[2]])}))return;
    await camTo(camFor(s.rect));if(my===token)setTimeout(()=>{if(cur===i&&my===token){replyRead=true;renderPhones()}},1500);return}
  if(!travel)setPos(s.at);
  const f=zoomInterp([cam.cx,cam.cy,cam.w],camFor(s.rect)),dc=Math.max(800,Math.min(2300,f.duration)),s0=pos;
  const dur=travel?Math.max(dc,1900):dc;
  await tween(dur,t=>{setCam(f(ease(Math.min(1,t*dur/dc))));if(travel)setPos(s0+(s.at-s0)*ease(t))});
  if(i===11){setTimeout(()=>{if(cur===11&&my===token){read=true;renderPhones()}},1700)}
}
function overview(){token++;camTo(camFor(OV))}
function zoomAt(px,py,f){token++;const k=kz(),wx=cam.cx+(px-W/2)/k,wy=cam.cy+(py-H/2)/k;
  const nw=Math.max(40,Math.min(26000,cam.w/f)),nk=W/nw;setCam([wx-(px-W/2)/nk,wy-(py-H/2)/nk,nw])}
function worldPt(px,py){const k=kz();return{x:cam.cx+(px-W/2)/k,y:cam.cy+(py-H/2)/k}}
function hitAt(px,py){const p=worldPt(px,py);let best=null;
  for(const[r,i]of HITS)if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h&&(!best||r.w*r.h<best[0].w*best[0].h))best=[r,i];return best}

/* input: mouse drag, touch drag, pinch zoom, tap/click */
let drag=null,pinch=null;const ptrs=new Map();
const two=()=>{const[a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}};
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,moved:false};
  else if(ptrs.size===2){token++;if(drag)drag.moved=true;pinch=two()}});
svg.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const n=two(),k=kz();setCam([cam.cx-(n.mx-pinch.mx)/k,cam.cy-(n.my-pinch.my)/k,cam.w]);zoomAt(n.mx,n.my,n.d/pinch.d);pinch=n;return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>(e.pointerType==='mouse'?5:10)){drag.moved=true;token++;svg.classList.add('dragging')}
    if(drag.moved){const k=kz();setCam([cam.cx-dx/k,cam.cy-dy/k,cam.w]);drag.x=e.clientX;drag.y=e.clientY}return}
  if(e.pointerType!=='mouse')return;
  const h=hitAt(e.clientX,e.clientY),hv=$('hover'),tip=$('tip');
  const k=kz(),small=h&&h[0].w*k<W*.8&&h[1]!==cur;
  if(small){const r=h[0];hv.setAttribute('display','');hv.setAttribute('x',r.x);hv.setAttribute('y',r.y);hv.setAttribute('width',r.w);hv.setAttribute('height',r.h);
    hv.setAttribute('rx',8/k);hv.setAttribute('stroke-width',4/k);svg.classList.add('pointing');
    tip.style.display='block';tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY+16)+'px';tip.textContent=`${h[1]} · ${STOPS[h[1]].nm}`}
  else{hv.setAttribute('display','none');svg.classList.remove('pointing');tip.style.display='none'}
});
const endPtr=e=>{const wasPinch=!!pinch;ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(wasPinch){drag=null;return}
  if(ptrs.size===0){const d=drag;drag=null;svg.classList.remove('dragging');
    if(d&&!d.moved&&e.type==='pointerup'){const h=hitAt(e.clientX,e.clientY);if(h)goTo(h[1])}}};
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))},{passive:false});
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();goTo(cur+1)}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();goTo(cur-1)}
  else if(k==='Escape'||k==='o'||k==='O')overview();
  else if(k==='Home'||k==='0')goTo(0);
  else if(/^[1-9]$/.test(k))goTo(+k);
  else if(k==='l'||k==='L'){locked=!locked;renderLock()}
  else if(k==='h'||k==='H'){document.body.classList.toggle('nocard');goTo(cur,{force:true})}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(k==='r'||k==='R'){if(cur>0){if(!STOPS[cur].lampo){const p=STOPS[cur-1];setPos(p.at)}goTo(cur,{replay:true})}}
  else if(k==='v'||k==='V'){const v=STOPS[cur].video;if(v)window.open(v[0][0]&&v[0][1],'_blank','noopener')}
  else if(k==='+'||k==='=')zoomAt(W/2,H/2,1.3);
  else if(k==='-'||k==='_')zoomAt(W/2,H/2,1/1.3);
});
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;applyLayout();setCam(camFor(STOPS[cur].rect))});

/* boot */
async function boot(){
  try{await Promise.all([document.fonts.load('700 20px Bricolage'),document.fonts.load('400 20px Atkinson'),document.fonts.load('700 20px Atkinson')])}catch(_){}
  svg.querySelectorAll('.lbl').forEach(g=>{const t=g.querySelector('text'),r=g.querySelector('.pill'),sz=+g.dataset.size,b=t.getBBox();
    r.setAttribute('x',b.x-sz*.6);r.setAttribute('width',b.width+sz*1.2);labels.push({el:g,size:sz,v:true})});
  applyLayout();renderLock();renderSteps();renderShow();setPos(0);setCam(camFor(OV));
}
boot();
</script>
